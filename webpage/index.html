<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <header class="form-header">
                <h2>Get in Touch</h2>
                <p>We'd love to hear from you. Please fill out the form below.</p>
            </header>

            <div id="successMessage" class="alert-success" style="display: none;">
                Your message has been submitted successfully!
            </div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                    <div id="nameError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address">
                    <div id="emailError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" rows="5" placeholder="Enter your message here..."></textarea>
                    <div id="messageError" class="error-message"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="btn-submit">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
